name: Probe shuttle feed (diagnostic)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe feed
        env:
          RIDESYSTEMS_BASE: ${{ vars.RIDESYSTEMS_BASE }}
        run: node scripts/probe-feed.mjs
