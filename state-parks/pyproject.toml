[project]
name = "state-parks-cabin-aggregator"
version = "0.1.0"
description = "Aggregates state park cabin availability across NC, SC, VA, GA, TN, DE and MD"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
# Only needed if a provider ever requires a rendered page. Nothing uses it yet
# -- every platform here is reachable with plain HTTP.
playwright = ["playwright>=1.44"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
state-parks = "state_parks.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["state_parks*"]

[tool.setuptools.package-data]
state_parks = ["database/*.sql"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
